name: blueprint

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/**'
      - '.github/workflows/blueprint.yml'
      - '**/*.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  pull_request:
    branches: [main]
    paths:
      - 'blueprint/**'
      - '.github/workflows/blueprint.yml'
      - '**/*.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch root Mathlib artifacts
        shell: bash
        run: |
          if pgrep -x 'lean|lake|lean.exe|lake.exe'; then exit 75; fi
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/blueprint-root-cache.log"
      # Restore only after Lake has cloned the dependency directories.
      # This key and these paths are shared with the verify job.
      - name: Cache root build products
        uses: actions/cache@v5
        with:
          path: |
            .lake/build
            .lake/packages/stoch_to_det/.lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ hashFiles('StochasticToDeterministicLatents.lean', 'StochasticToDeterministicLatents/**/*.lean', 'Verify.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - name: Build the root library
        shell: bash
        run: |
          if pgrep -x 'lean|lake|lean.exe|lake.exe'; then exit 75; fi
          lake build 2>&1 | tee "$RUNNER_TEMP/blueprint-root-build.log"
      # The committed nested manifest resolves a separate Mathlib checkout.
      - name: Fetch nested Mathlib artifacts
        working-directory: blueprint
        shell: bash
        run: |
          if pgrep -x 'lean|lake|lean.exe|lake.exe'; then exit 75; fi
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/blueprint-nested-cache.log"
      # The nested fetch creates the package directories before restoration.
      - name: Cache Verso build products
        uses: actions/cache@v5
        with:
          path: |
            blueprint/.lake/packages/verso/.lake/build
            blueprint/.lake/packages/VersoBlueprint/.lake/build
            blueprint/.lake/packages/subverso/.lake/build
            blueprint/.lake/packages/MD4Lean/.lake/build
            blueprint/.lake/packages/illuminate/.lake/build
            blueprint/.lake/packages/verso-slides/.lake/build
            blueprint/.lake/build
          key: verso-build-${{ runner.os }}-${{ hashFiles('blueprint/lake-manifest.json', 'blueprint/lean-toolchain') }}-${{ hashFiles('blueprint/**/*.lean') }}
          restore-keys: |
            verso-build-${{ runner.os }}-${{ hashFiles('blueprint/lake-manifest.json', 'blueprint/lean-toolchain') }}-
      - name: Build and check the blueprint
        working-directory: blueprint
        shell: bash
        run: bash scripts/ci.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/_out/site/html-multi

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
